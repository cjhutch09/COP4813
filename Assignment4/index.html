    <main class="container">

        <h1>Equation plotter</h1>

        <p class="equation">
            y = A sin(Bx) + C cos(Dx)
        </p>
		<br>
        <p class="equation">
            Equation Values
        </p>
        <section class="controls">

            <div class="input-group">
                <label for="a">A:</label>
                <input type="number" id="a" value="5" step="0.1">
            </div>

            <div class="input-group">
                <label for="b">B:</label>
                <input type="number" id="b" value="1.4" step="0.1">
            </div>

            <div class="input-group">
                <label for="c">C:</label>
                <input type="number" id="c" value="3" step="0.1">
            </div>
            <div class="input-group">
                <label for="d">D:</label>
                <input type="number" id="d" value="2.7" step="0.1">
            </div>
			<div class="empty">
			</div>
			<div class="empty">
			</div>			
			<div class="empty">
			</div>
			<h1>Chart Options</h1>
			<div class="empty">
			</div>
            <div class="input-group">
                <label for="xmin">X Minimum:</label>
                <input type="number" id="xmin" value="-10" step="1">
            </div>

            <div class="input-group">
                <label for="xmax">X Maximum:</label>
                <input type="number" id="xmax" value="10" step="1">
            </div>
			<div class="input-group">
                <label for="steps">Step:</label>
                <input type="number" id="steps" value="0.3" step="0.1" min="0.1" max="50">
            </div>
			<div class="input-group">
                <label for="ptsz">Point Size:</label>
                <input type="number" id="ptsz" value="1.5" step="0.1" min="0.1" max="3">
            </div>

        </section>

        <button id="plotButton">Plot Equation</button>

        <p id="result"></p>

        <section class="chart-container">
            <canvas id="myChart"></canvas>
        </section>

    </main>

    <script src="plot.js"></script>
