<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <main class="container">
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Player-season records</span>
        <strong id="recordCount">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Unique players</span>
        <strong id="playerCount">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Highest PPG</span>
        <strong id="highestPpg">—</strong>
      </div>
    </section>

    <section class="data-card">
      <div class="toolbar">
        <input
          id="searchInput"
          type="search"
          placeholder="Search player, season, or year..."
          aria-label="Search player data"
        >

        <select id="yearFilter" aria-label="Filter by year">
          <option value="">All years</option>
        </select>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th data-sort="name">Player <span>↕</span></th>
              <th data-sort="season">Season <span>↕</span></th>
              <th data-sort="year">Year <span>↕</span></th>
              <th data-sort="avg_scoring_ppg">PPG <span>↕</span></th>
            </tr>
          </thead>
          <tbody id="playerTableBody"></tbody>
        </table>
      </div>

      <div class="table-footer" id="resultSummary"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
