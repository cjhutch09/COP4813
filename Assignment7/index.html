  <main>

    <section class="discard-area" aria-label="Discard area">
	<span id="deckStatus" class="deck-status">No cards dealt yet</span>
      <div class="discard-copy">
	        <div class="stat">
        <span class="stat-label">Discarded</span>
        <strong id="discardCount">0</strong>
      </div>
      </div>
      <div id="discardPile" class="discard-pile" role="region">
        <span class="discard-placeholder">DROP CARD HERE</span>
      </div>
      <div class="discard-actions">
        <p class="decision-prompt" id="decisionPrompt">Discard a card to choose whether to draw a replacement.</p>
	          <div class="decision-buttons">
          <button id="drawReplacementButton" class="primary-button" type="button" disabled>Discard &amp; Draw</button>
          <button id="discardOnlyButton" class="secondary-button" type="button" disabled>Discard Only</button>
        </div>
      </div>


    </section>

    <section class="cards-section" >

      <div id="cardGrid" class="card-grid">
        <div class="empty-state">

        </div>
      </div>
    </section>
		 <div class="box">
	 <button id="dealButton" class="primary-button discard-deal-button" type="button">Deal</button>
	 <div>
	 <p>Select how many cards to deal</p>
	 <input type="number" id="cardCount" min="1" max="52" value="5">
	</div>
	</div>
  </main>
